name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-dsp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Isrc src/dsp/BiquadFilter.cpp src/dsp/Q10Processor.cpp tests/BiquadFilterTests.cpp tests/Q10ProcessorTests.cpp -o g3x-q10-tests
      - run: ./g3x-q10-tests

  windows-dsp-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lukka/get-cmake@latest
      - run: cmake -S . -B build -DG3X_BUILD_PLUGIN=OFF
      - run: cmake --build build --config Release --target g3x_q10_tests
      - run: ctest --test-dir build --build-config Release --output-on-failure

  windows-vst3:
    needs: [linux-dsp-tests, windows-dsp-tests]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lukka/get-cmake@latest
      - run: cmake -S . -B build -A x64 -DG3X_BUILD_TESTS=OFF -DG3X_BUILD_PLUGIN=ON
      - run: cmake --build build --config Release --target G3XEqualizer_VST3 G3XEqualizer_Standalone
      - name: Test VST3 packaging
        shell: pwsh
        run: ./scripts/test-package-vst3.ps1
      - name: Package Windows VST3
        shell: pwsh
        run: ./scripts/package-vst3.ps1 -BundlePath "build/G3XEqualizer_artefacts/Release/VST3/G3X Equalizer.vst3" -Destination dist
      - name: Upload Windows VST3
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: G3X-Equalizer-Windows-x64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Download instructions
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          "[Download Windows x64 VST3]($env:ARTIFACT_URL) — available for 30 days." >> $env:GITHUB_STEP_SUMMARY
          "Extract the ZIP, verify SHA256SUMS.txt, then copy the entire G3X Equalizer.vst3 folder to your VST3 directory." >> $env:GITHUB_STEP_SUMMARY
