name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-dsp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Isrc src/dsp/BiquadFilter.cpp tests/BiquadFilterTests.cpp -o g3x-q10-tests
      - run: ./g3x-q10-tests

  windows-dsp-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lukka/get-cmake@latest
      - run: cmake -S . -B build
      - run: cmake --build build --config Release --target g3x_q10_tests
      - run: ctest --test-dir build --build-config Release --output-on-failure
